<text x="128" y="224" font-size="12.5" font-weight="700" fill="#1a1a2e">FSBL2</text>
<text x="128" y="240" font-size="11" fill="#374151">256 KB · 백업</text>
<text x="112" y="218" font-size="10.5" fill="#6b7280" text-anchor="end" font-family="ui-monospace,Menlo,monospace">0x7004_0000</text>
