<text x="128" y="464" font-size="11" fill="#374151">download --target data</text>
<text x="112" y="428" font-size="10.5" fill="#6b7280" text-anchor="end" font-family="ui-monospace,Menlo,monospace">0x7110_0000</text>
<text x="112" y="490" font-size="10.5" fill="#6b7280" text-anchor="end" font-family="ui-monospace,Menlo,monospace">0x7400_0000</text>
