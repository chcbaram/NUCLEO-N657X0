<defs><marker id="cp" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#7c3aed"/></marker><marker id="dt" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 z" fill="#0891b2"/></marker></defs>
<rect width="1100" height="700" fill="#fbfbfd"/>
<text x="28" y="40" font-size="20" font-weight="700" fill="#1a1a2e">앱 실행 방식별 메모리맵 — APP_RUN = SRAM / XIP</text>
<text x="28" y="64" font-size="13" fill="#4b5563">FSBL(stm32n6-boot) 은 앱 이미지의 firm_ver_t.firm_addr 로 방식을 고른다. RAM 주소면 복사해서, NOR 주소면 그 자리에서 실행한다.</text>
<rect x="28" y="84" width="510" height="560" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
<text x="48" y="112" font-size="16" font-weight="700" fill="#166534">APP_RUN = SRAM</text>
<text x="48" y="131" font-size="11.5" fill="#6b7280" font-family="ui-monospace,Menlo,monospace">stm32n657xx_sram.ld</text>
<text x="118" y="156" font-size="12.5" font-weight="700" fill="#1a1a2e">외부 NOR (XSPI2)</text>
<text x="328" y="156" font-size="12.5" font-weight="700" fill="#1a1a2e">내부 RAM</text>
<rect x="118" y="166" width="130" height="40" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/>
<text x="128" y="184" font-size="12.5" font-weight="700" fill="#1a1a2e">FSBL1</text>
<text x="128" y="200" font-size="11" fill="#374151">256 KB · STM2 헤더</text>
<text x="112" y="178" font-size="10.5" fill="#6b7280" text-anchor="end" font-family="ui-monospace,Menlo,monospace">0x7000_0000</text>
