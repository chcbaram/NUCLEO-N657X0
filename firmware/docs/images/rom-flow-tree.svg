<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="t1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="960" height="880" fill="#fbfbfd"/>
  <text x="30" y="38" font-size="18" font-weight="700" fill="#1a1a2e">BootROM 내부 실행 순서</text>
  <text x="30" y="59" font-size="12.5" fill="#6b7280">UM3234 Rev5 §2.2 / §3 / §5 기준</text>

  <!-- entry -->
  <rect x="30" y="76" width="900" height="34" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="46" y="98" font-size="13" font-weight="700" fill="#5b21b6">ROM 진입 — 0x1800_0000 · HDPL0 · secure state</text>

  <!-- init chain -->
  <line x1="60" y1="110" x2="60" y2="290" stroke="#c4b5fd" stroke-width="2"/>
  <g font-size="12.5">
    <line x1="60" y1="132" x2="86" y2="132" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="90" y="118" width="840" height="28" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="104" y="137" fill="#1a1a2e">system init — 벡터 설정 · SAU 8영역 · MPU_S · RISAF3 7영역 · ICACHE ON</text>

    <line x1="60" y1="168" x2="86" y2="168" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="90" y="154" width="840" height="28" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="104" y="173" fill="#1a1a2e">RCC_HWRSR 로 리셋 원인 판정 후 즉시 클리어  (앱은 RCC_RSR 을 봐야 한다)</text>

    <line x1="60" y1="204" x2="86" y2="204" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="90" y="190" width="840" height="28" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="104" y="209" fill="#1a1a2e">potential tamper 보호 ON — SYSCFG_POTTAMPRSTCR</text>

    <line x1="60" y1="240" x2="86" y2="240" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="90" y="226" width="840" height="28" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="104" y="245" fill="#1a1a2e">라이프사이클 판정 — BSEC fuses (OTP18 secure_boot / prov_done, OTP124.20)</text>

    <line x1="60" y1="276" x2="86" y2="276" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="90" y="262" width="840" height="28" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="104" y="281" font-weight="600" fill="#3730a3">부트 설정 결정 — SYSCFG_BOOTSR[1:0] + OTP11[8:5] flash_boot_source</text>
  </g>

  <!-- branches -->
  <line x1="60" y1="290" x2="60" y2="404" stroke="#9ca3af" stroke-width="2"/>
  <line x1="60" y1="318" x2="86" y2="318" stroke="#9ca3af" stroke-width="2" marker-end="url(#t1)"/>
  <rect x="94" y="304" width="836" height="28" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="108" y="323" font-size="12.5" fill="#78350f"><tspan font-weight="700">Dev boot</tspan>  (BOOT1=1) — 디버그 secure 재개방 → 무한 루프. FSBL 로드 없음</text>

  <line x1="60" y1="360" x2="86" y2="360" stroke="#9ca3af" stroke-width="2" marker-end="url(#t1)"/>
  <rect x="94" y="346" width="836" height="28" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="108" y="365" font-size="12.5" fill="#1e3a8a"><tspan font-weight="700">Serial boot</tspan>  (BOOT0=1) — USB DFU / USART1·2·UART4 병렬 폴링 → download buffer</text>

  <line x1="60" y1="402" x2="86" y2="402" stroke="#9ca3af" stroke-width="2" marker-end="url(#t1)"/>
  <rect x="94" y="388" width="836" height="28" rx="4" fill="#dcfce7" stroke="#4ade80"/>
  <text x="108" y="407" font-size="12.5" fill="#14532d"><tspan font-weight="700">Flash boot</tspan>  (BOOT0=0, BOOT1=0) — XSPIM_P2 NOR +0x0 → download buffer 0x3418_0000</text>

  <!-- secure boot chain -->
  <line x1="130" y1="416" x2="130" y2="618" stroke="#4ade80" stroke-width="2"/>
  <g font-size="12.5">
    <line x1="130" y1="440" x2="156" y2="440" stroke="#4ade80" stroke-width="2"/>
    <rect x="160" y="426" width="770" height="28" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="174" y="445" fill="#1a1a2e">파라미터 검사 — 헤더 geometry + 안티롤백 (헤더 Version ≥ OTP20/21)</text>

    <line x1="130" y1="476" x2="156" y2="476" stroke="#4ade80" stroke-width="2"/>
    <rect x="160" y="462" width="770" height="28" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="174" y="481" fill="#1a1a2e">ECDSA 인증 — OTP17 oem_active_signing_key 로 활성 키 선택</text>

    <line x1="130" y1="512" x2="156" y2="512" stroke="#4ade80" stroke-width="2"/>
    <rect x="160" y="498" width="770" height="28" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="174" y="517" fill="#1a1a2e">복호 (선택) — OTP18[4] fsbl_decrypt_prio : 0 = CRYP, 1 = SAES</text>

    <line x1="130" y1="562" x2="156" y2="562" stroke="#f87171" stroke-width="2"/>
    <rect x="160" y="534" width="770" height="56" rx="4" fill="#fee2e2" stroke="#f87171"/>
    <text x="174" y="554" font-weight="700" fill="#991b1b">실패 시</text>
    <text x="174" y="573" fill="#7f1d1d">buffer clear → FSBL2 (+0x4_0000) 재시도 → 그래도 실패면 serial boot 폴백</text>
    <text x="174" y="586" font-size="11.5" fill="#b91c1c">blocking failure 면 BOOTFAILN 핀 low + PG10(UART5_TX) 9600 bps 에러 로그</text>

    <line x1="130" y1="616" x2="156" y2="616" stroke="#4ade80" stroke-width="2"/>
    <rect x="160" y="602" width="770" height="28" rx="4" fill="#dcfce7" stroke="#22c55e"/>
    <text x="174" y="621" font-weight="700" fill="#166534">성공</text>
  </g>

  <!-- handover -->
  <line x1="200" y1="630" x2="200" y2="782" stroke="#22c55e" stroke-width="2"/>
  <g font-size="12.5">
    <line x1="200" y1="654" x2="226" y2="654" stroke="#22c55e" stroke-width="2"/>
    <rect x="230" y="640" width="700" height="28" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="244" y="659" fill="#1a1a2e">boot context 구조체 갱신 — 0x3410_0000</text>

    <line x1="200" y1="690" x2="226" y2="690" stroke="#22c55e" stroke-width="2"/>
    <rect x="230" y="676" width="700" height="28" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="244" y="695" fill="#1a1a2e">DCACHE clean + invalidate, 라이프사이클별 캐시 재구성</text>

    <line x1="200" y1="726" x2="226" y2="726" stroke="#22c55e" stroke-width="2"/>
    <rect x="230" y="712" width="700" height="28" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="244" y="731" fill="#1a1a2e">potential tamper 보호 해제 · BSEC_UNMAPR ← 0xB9D8_FF1F (ROM 자기 은닉) · HDPL 증가</text>

    <line x1="200" y1="766" x2="226" y2="766" stroke="#22c55e" stroke-width="2"/>
    <rect x="230" y="748" width="700" height="36" rx="4" fill="#1a1a2e"/>
    <text x="244" y="771" font-size="13" font-weight="700" fill="#ffffff">점프 — r0 = 0x3410_0000, PC = header.entry_point (= 0x3418_0400)</text>
  </g>

  <line x1="480" y1="784" x2="480" y2="806" stroke="#6b7280" stroke-width="2" marker-end="url(#t1)"/>
  <rect x="230" y="810" width="500" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="480" y="832" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">FSBL — 클럭 / 전원 / MPU / 캐시 / 외부메모리 초기화</text>
</svg>
