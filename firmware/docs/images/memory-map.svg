<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <rect width="960" height="1000" fill="#fbfbfd"/>
  <text x="30" y="40" font-size="22" font-weight="700" fill="#1a1a2e">STM32N657X0 메모리 맵 (부팅 관련 영역)</text>
  <text x="30" y="63" font-size="13" fill="#6b7280">내장 유저 플래시 없음 · 4.2 MB 연속 SRAM · 코드는 항상 외부에서 로드된다</text>

  <!-- column headers -->
  <text x="60"  y="100" font-size="12.5" font-weight="700" fill="#6b7280">Non-secure alias</text>
  <text x="330" y="100" font-size="12.5" font-weight="700" fill="#6b7280">Secure alias</text>
  <text x="600" y="100" font-size="12.5" font-weight="700" fill="#6b7280">영역</text>
  <text x="860" y="100" font-size="12.5" font-weight="700" fill="#6b7280">크기</text>
  <line x1="30" y1="108" x2="930" y2="108" stroke="#d1d5db"/>

  <g font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">

    <!-- external -->
    <rect x="30" y="118" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="136" fill="#4b5563">0xD000_0000</text><text x="330" y="136" fill="#4b5563">—</text>
    <text x="600" y="136" fill="#1a1a2e" font-family="inherit">SDRAM 2 (FMC 경유)</text><text x="860" y="136" fill="#6b7280">256 MB</text>

    <rect x="30" y="146" width="900" height="26" fill="#ffffff"/>
    <text x="60" y="164" fill="#4b5563">0xC000_0000</text><text x="330" y="164" fill="#4b5563">—</text>
    <text x="600" y="164" fill="#1a1a2e" font-family="inherit">SDRAM 1 (FMC 경유)</text><text x="860" y="164" fill="#6b7280">256 MB</text>

    <rect x="30" y="174" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="192" fill="#4b5563">0x9000_0000</text><text x="330" y="192" fill="#4b5563">—</text>
    <text x="600" y="192" fill="#1a1a2e" font-family="inherit">XSPI1</text><text x="860" y="192" fill="#6b7280">256 MB</text>

    <rect x="30" y="202" width="900" height="26" fill="#ffffff"/>
    <text x="60" y="220" fill="#4b5563">0x8000_0000</text><text x="330" y="220" fill="#4b5563">—</text>
    <text x="600" y="220" fill="#1a1a2e" font-family="inherit">XSPI3</text><text x="860" y="220" fill="#6b7280">256 MB</text>

    <rect x="30" y="230" width="900" height="44" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="60" y="248" fill="#1e3a8a" font-weight="700">0x7000_0000</text><text x="330" y="248" fill="#1e3a8a">—</text>
    <text x="600" y="248" fill="#1e40af" font-weight="700" font-family="inherit">XSPI2 ← 부트 플래시</text><text x="860" y="248" fill="#1e3a8a">256 MB</text>
    <text x="600" y="266" fill="#1e3a8a" font-size="11.5" font-family="inherit">보드: MX25UM51245G 64 MB · FSBL1 @+0x0, FSBL2 @+0x4_0000, App @+0x10_0000</text>

    <rect x="30" y="276" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="294" fill="#4b5563">0x6000_0000</text><text x="330" y="294" fill="#4b5563">—</text>
    <text x="600" y="294" fill="#1a1a2e" font-family="inherit">FMC NOR / SRAM</text><text x="860" y="294" fill="#6b7280">256 MB</text>

    <rect x="30" y="304" width="900" height="26" fill="#ffffff"/>
    <text x="60" y="322" fill="#4b5563">0x4000_0000</text><text x="330" y="322" fill="#4b5563">0x5000_0000</text>
    <text x="600" y="322" fill="#1a1a2e" font-family="inherit">Peripherals (APB1..AHB5)</text><text x="860" y="322" fill="#6b7280">—</text>
  </g>

  <line x1="30" y1="342" x2="930" y2="342" stroke="#d1d5db" stroke-dasharray="4 3"/>
  <text x="30" y="362" font-size="13" font-weight="700" fill="#374151">내장 SRAM (합계 4.2 MB)</text>

  <g font-size="12.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="30" y="374" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="392" fill="#4b5563">0x2C00_0000</text><text x="330" y="392" fill="#4b5563">0x3C00_0000</text>
    <text x="600" y="392" fill="#1a1a2e" font-family="inherit">Backup SRAM (VBAT 유지)</text><text x="860" y="392" fill="#6b7280">8 KB</text>

    <rect x="30" y="402" width="900" height="26" fill="#ffffff"/>
    <text x="60" y="420" fill="#4b5563">0x2800_4000</text><text x="330" y="420" fill="#4b5563">0x3800_4000</text>
    <text x="600" y="420" fill="#1a1a2e" font-family="inherit">AHBSRAM2 (secure RAM)</text><text x="860" y="420" fill="#6b7280">16 KB</text>

    <rect x="30" y="430" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="448" fill="#4b5563">0x2800_0000</text><text x="330" y="448" fill="#4b5563">0x3800_0000</text>
    <text x="600" y="448" fill="#1a1a2e" font-family="inherit">AHBSRAM1</text><text x="860" y="448" fill="#6b7280">16 KB</text>

    <rect x="30" y="458" width="900" height="26" fill="#ffffff"/>
    <text x="60" y="476" fill="#4b5563">0x2440_0000</text><text x="330" y="476" fill="#4b5563">0x3440_0000</text>
    <text x="600" y="476" fill="#1a1a2e" font-family="inherit">VENCRAM / AXISRAM8</text><text x="860" y="476" fill="#6b7280">128 KB</text>

    <rect x="30" y="486" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="504" fill="#4b5563">0x243C_0000</text><text x="330" y="504" fill="#4b5563">0x343C_0000</text>
    <text x="600" y="504" fill="#1a1a2e" font-family="inherit">CACHEAXI / AXISRAM7</text><text x="860" y="504" fill="#6b7280">256 KB</text>

    <rect x="30" y="514" width="900" height="26" fill="#ffffff"/>
    <text x="60" y="532" fill="#4b5563">0x2420_0000</text><text x="330" y="532" fill="#4b5563">0x3420_0000</text>
    <text x="600" y="532" fill="#1a1a2e" font-family="inherit">AXISRAM3 ~ 6 (NPU 도메인)</text><text x="860" y="532" fill="#6b7280">4 × 448 KB</text>

    <rect x="30" y="542" width="900" height="60" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="562" fill="#5b21b6" font-weight="700">0x2410_0000</text><text x="330" y="562" fill="#5b21b6" font-weight="700">0x3410_0000</text>
    <text x="600" y="562" fill="#5b21b6" font-weight="700" font-family="inherit">AXISRAM2 ← BootROM 작업영역</text><text x="860" y="562" fill="#5b21b6">1024 KB</text>
    <text x="600" y="580" fill="#6d28d9" font-size="11.5" font-family="inherit">하위 512 KB: ROM 컨텍스트 / 스택 / 트레이스</text>
    <text x="600" y="596" fill="#6d28d9" font-size="11.5" font-family="inherit">상위 512 KB: FSBL download buffer @ 0x*418_0000</text>

    <rect x="30" y="604" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="622" fill="#4b5563">0x2406_4000</text><text x="330" y="622" fill="#4b5563">0x3406_4000</text>
    <text x="600" y="622" fill="#1a1a2e" font-family="inherit">AXISRAM1</text><text x="860" y="622" fill="#6b7280">624 KB</text>

    <rect x="30" y="632" width="900" height="44" fill="#dcfce7" stroke="#4ade80"/>
    <text x="60" y="650" fill="#166534" font-weight="700">0x2400_0000</text><text x="330" y="650" fill="#166534" font-weight="700">0x3400_0000</text>
    <text x="600" y="650" fill="#166534" font-weight="700" font-family="inherit">FLEXRAM ← LRUN 앱 로드 위치</text><text x="860" y="650" fill="#166534">최대 400 KB</text>
    <text x="600" y="668" fill="#15803d" font-size="11.5" font-family="inherit">LRUN: 헤더 @0x3400_0000, 앱 엔트리 @0x3400_0400</text>

    <rect x="30" y="678" width="900" height="26" fill="#ffffff"/>
    <text x="60" y="696" fill="#4b5563">0x2000_0000</text><text x="330" y="696" fill="#4b5563">0x3000_0000</text>
    <text x="600" y="696" fill="#1a1a2e" font-family="inherit">DTCM (baseline 128 KB + FLEXMEM 확장)</text><text x="860" y="696" fill="#6b7280">~256 KB</text>

    <rect x="30" y="706" width="900" height="34" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="60" y="727" fill="#92400e" font-weight="700">0x0800_0000</text><text x="330" y="727" fill="#92400e" font-weight="700">0x1800_0000</text>
    <text x="600" y="727" fill="#92400e" font-weight="700" font-family="inherit">BootROM ← 리셋 후 첫 코드</text><text x="860" y="727" fill="#92400e">128 KB</text>

    <rect x="30" y="742" width="900" height="26" fill="#f3f4f6"/>
    <text x="60" y="760" fill="#4b5563">0x0000_0000</text><text x="330" y="760" fill="#4b5563">0x1000_0000</text>
    <text x="600" y="760" fill="#1a1a2e" font-family="inherit">ITCM (baseline 64 KB + FLEXMEM 확장)</text><text x="860" y="760" fill="#6b7280">~256 KB</text>
  </g>

  <rect x="30" y="792" width="900" height="96" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="46" y="814" font-size="13" font-weight="700" fill="#9a3412">리셋 직후 CPU 벡터</text>
  <text x="46" y="836" font-size="12" fill="#7c2d12">SYSCFG_INITSVTORCR  리셋값 0x1800_0000  (secure   → BootROM)</text>
  <text x="46" y="856" font-size="12" fill="#7c2d12">SYSCFG_INITNSVTORCR 리셋값 0x0800_0000  (non-secure → BootROM)</text>
  <text x="46" y="878" font-size="12" fill="#7c2d12">Standby 복귀 시에는 BootROM을 거치지 않고 이 두 레지스터가 가리키는 주소에서 바로 재개한다.</text>

  <text x="30" y="920" font-size="11.5" fill="#6b7280">주소 출처: RM0486 Rev4 Table 1 / Table 2, Figure 10.  ·  * = 2(non-secure) 또는 3(secure) alias</text>
  <text x="30" y="940" font-size="11.5" fill="#6b7280">AXISRAM3~6은 리셋 직후 shutdown 상태(RCC_MEMENR). 사용 전에 RAMCFG_AXISRAMxCR.SRAMSD 해제 + 클럭 인에이블 필요.</text>
</svg>
