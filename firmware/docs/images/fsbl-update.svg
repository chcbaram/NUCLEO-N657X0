<line x1="576" y1="254" x2="590" y2="254" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)"/>
<text x="677.0" y="104" font-size="15" font-weight="700" fill="#1a1a2e" text-anchor="middle">④ FSBL1 본문 복사</text>
<text x="677.0" y="124" font-size="12" fill="#6b7280" text-anchor="middle">헤더 매직은 아직 0xFF</text>
