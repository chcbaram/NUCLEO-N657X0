<text x="38" y="284" font-size="13" font-weight="700" fill="#1e40af">FSBL2</text>
<text x="188" y="284" font-size="10.5" fill="#1e40af" text-anchor="end" font-family="ui-monospace,Menlo,monospace">0x7004_0000</text>
<text x="113.0" y="340" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">이전 이미지</text>
