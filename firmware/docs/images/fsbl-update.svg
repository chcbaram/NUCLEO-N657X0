<rect x="28" y="484" width="924" height="104" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
<text x="46" y="510" font-size="14" font-weight="700" fill="#5b21b6">BootROM 규칙 (Flash boot)</text>
<text x="46" y="534" font-size="13" fill="#4c1d95">FSBL1 헤더를 확인 → 실패하면 FSBL2 → 둘 다 실패하면 serial boot (USB DFU / UART)</text>
<text x="46" y="556" font-size="13" fill="#4c1d95">이 보드(CLOSED_UNLOCKED, 키 없는 서명)는 본문을 검증하지 않는다 → 헤더 매직을 마지막에 써야 반쯤 복사된 FSBL1 이 실행되지 않는다</text>
<text x="46" y="578" font-size="12" fill="#6b7280" font-family="ui-monospace,Menlo,monospace">실측: FSBL1 헤더를 지우고 리셋 → ERR 0x1D000002 (FSBL1) → INFO 0x80000002 0x00040000 (FSBL2) 로 부팅</text>
<rect x="28" y="620" width="16" height="12" rx="2" fill="#dbeafe" stroke="#60a5fa"/>
<text x="50" y="630" font-size="12" fill="#4b5563">이전 이미지</text>
<rect x="138" y="620" width="16" height="12" rx="2" fill="#dcfce7" stroke="#22c55e"/>
<text x="160" y="630" font-size="12" fill="#4b5563">새 이미지</text>
<rect x="248" y="620" width="16" height="12" rx="2" fill="#fef3c7" stroke="#f59e0b"/>
<text x="270" y="630" font-size="12" fill="#4b5563">쓰는 중</text>
<text x="952" y="630" font-size="11.5" fill="#9ca3af" text-anchor="end">NUCLEO-N657X0 · tools/download.py --target boot</text>
