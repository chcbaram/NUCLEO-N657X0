<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7c3aed"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#f59e0b" stroke-width="2" opacity="0.35"/></pattern></defs>
<rect width="980" height="650" fill="#fbfbfd"/>
<text x="28" y="40" font-size="20" font-weight="700" fill="#1a1a2e">STM32N6 FSBL 업데이트 — FSBL1 / FSBL2 두 슬롯으로 전원이 끊겨도 부팅</text>
<text x="28" y="64" font-size="13" fill="#4b5563">새 이미지를 FSBL2 에 먼저 쓰고 검증한 뒤 FSBL1 로 복사한다. FSBL1 의 헤더 매직(STM2)은 맨 마지막에 쓴다 = 커밋.</text>
<text x="113.0" y="104" font-size="15" font-weight="700" fill="#1a1a2e" text-anchor="middle">① 시작</text>
