<svg xmlns="http://www.w3.org/2000/svg" width="980" height="800" viewBox="0 0 980 800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<rect width="980" height="800" fill="#fbfbfd"/>
<text x="28" y="40" font-size="20" font-weight="700" fill="#1a1a2e">cmd 패킷 구성 — 부트로더 다운로드 프로토콜</text>
<text x="28" y="64" font-size="13" fill="#4b5563">little endian · 헤더 9 바이트 + 데이터(0 ~ 1024) + 체크섬 1 바이트 · 같은 형식으로 요청과 응답을 주고받는다</text>
<rect x="40" y="100" width="56" height="58" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="68.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">STX0</text>
<text x="68.0" y="145" font-size="12" fill="#374151" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">02</text>
<rect x="96" y="100" width="56" height="58" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="124.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">STX1</text>
<text x="124.0" y="145" font-size="12" fill="#374151" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">FD</text>
<rect x="152" y="100" width="56" height="58" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="180.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">type</text>
<rect x="208" y="100" width="112" height="58" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
<text x="264.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">cmd</text>
<text x="264.0" y="145" font-size="12" fill="#374151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">L  H</text>
<rect x="320" y="100" width="112" height="58" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
<text x="376.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">err</text>
<text x="376.0" y="145" font-size="12" fill="#374151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">L  H</text>
<rect x="432" y="100" width="112" height="58" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="488.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">len</text>
<text x="488.0" y="145" font-size="12" fill="#374151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">L  H</text>
<rect x="544" y="100" width="336" height="58" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
<text x="712.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">data</text>
<text x="712.0" y="145" font-size="12" fill="#374151" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">0 ~ 1024 바이트</text>
<rect x="880" y="100" width="56" height="58" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
<text x="908.0" y="125" font-size="14" font-weight="700" fill="#1a1a2e" text-anchor="middle">chk</text>
<text x="68.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[0]</text>
<text x="124.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[1]</text>
<text x="180.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[2]</text>
<text x="264.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[3][4]</text>
<text x="376.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[5][6]</text>
<text x="488.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[7][8]</text>
<text x="712.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[9] ~ [9+len-1]</text>
<text x="908.0" y="176" font-size="11" fill="#6b7280" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">[9+len]</text>
<path d="M40,92 L40,86 L544,86 L544,92" fill="none" stroke="#9ca3af"/>
<text x="292.0" y="81" font-size="11.5" fill="#6b7280" text-anchor="middle">헤더 9 바이트</text>
<rect x="40" y="206" width="296" height="132" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="40" y="206" width="6" height="132" rx="3" fill="#3b82f6"/>
<text x="58" y="230" font-size="14" font-weight="700" fill="#1a1a2e">type</text>
<text x="58" y="254" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x00  CMD   요청</text>
<text x="58" y="272" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x01  RESP  응답</text>
<text x="58" y="290" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x02  EVENT</text>
<text x="58" y="308" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x03  LOG</text>
<text x="58" y="326" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x04  PING</text>
<rect x="350" y="206" width="296" height="132" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="350" y="206" width="6" height="132" rx="3" fill="#ef4444"/>
<text x="368" y="230" font-size="14" font-weight="700" fill="#1a1a2e">err</text>
<text x="368" y="254" font-size="12.5" fill="#374151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">요청은 0</text>
<text x="368" y="272" font-size="12.5" fill="#374151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">응답에서 결과 코드</text>
<text x="368" y="290" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x0000 OK</text>
<text x="368" y="308" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x000C FLASH_ERASE</text>
<text x="368" y="326" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">0x000D WRONG_RANGE</text>
<rect x="660" y="206" width="296" height="132" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
<rect x="660" y="206" width="6" height="132" rx="3" fill="#6b7280"/>
<text x="678" y="230" font-size="14" font-weight="700" fill="#1a1a2e">chk</text>
<text x="678" y="254" font-size="12.5" fill="#374151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">STX0 부터 data 끝까지</text>
<text x="678" y="272" font-size="12.5" fill="#374151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">바이트 합의 2 의 보수</text>
<text x="678" y="290" font-size="12.5" fill="#374151" font-family="ui-monospace,Menlo,monospace">chk = (~sum) + 1</text>
<text x="678" y="308" font-size="12.5" fill="#374151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">받는 쪽은 다시 계산해</text>
<text x="678" y="326" font-size="12.5" fill="#374151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">다르면 ERR_CMD_CHECKSUM</text>
<text x="40" y="370" font-size="15" font-weight="700" fill="#1a1a2e">주요 cmd 와 data</text>
<text x="40" y="396" font-size="12" font-weight="700" fill="#6b7280">cmd</text>
<text x="120" y="396" font-size="12" font-weight="700" fill="#6b7280">이름</text>
<text x="230" y="396" font-size="12" font-weight="700" fill="#6b7280">요청 data</text>
<text x="470" y="396" font-size="12" font-weight="700" fill="#6b7280">설명</text>
<line x1="40" y1="403" x2="940" y2="403" stroke="#e5e7eb"/>
<text x="40" y="422" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">0x0000</text>
<text x="120" y="422" font-size="12.5" fill="#1e40af" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">INFO</text>
<text x="230" y="422" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">—</text>
<text x="470" y="422" font-size="12.5" fill="#374151" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">boot_info_t (이름, 버전, 영역, 보율)</text>
<text x="40" y="444" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">0x0002</text>
<text x="120" y="444" font-size="12.5" fill="#1e40af" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">FW_BEGIN</text>
<text x="230" y="444" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">size:4  target:1  offset:4</text>
<text x="470" y="444" font-size="12.5" fill="#374151" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">target 0 = fw · 1 = boot · 2 = data (없으면 fw)</text>
<text x="40" y="466" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">0x0003</text>
<text x="120" y="466" font-size="12.5" fill="#1e40af" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">FW_ERASE</text>
<text x="230" y="466" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">—</text>
<text x="470" y="466" font-size="12.5" fill="#374151" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">대상 영역을 지운다</text>
<text x="40" y="488" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">0x0004</text>
<text x="120" y="488" font-size="12.5" fill="#1e40af" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">FW_WRITE</text>
<text x="230" y="488" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">offset:4  data:N</text>
<text x="470" y="488" font-size="12.5" fill="#374151" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">N ≤ 1020</text>
<text x="40" y="510" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">0x0006</text>
<text x="120" y="510" font-size="12.5" fill="#1e40af" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">FW_END</text>
<text x="230" y="510" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">—</text>
<text x="470" y="510" font-size="12.5" fill="#374151" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">응답 size:4  crc:4 → PC 가 CRC 비교</text>
<text x="40" y="532" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">0x0020</text>
<text x="120" y="532" font-size="12.5" fill="#1e40af" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">BAUD</text>
<text x="230" y="532" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">baud:4</text>
<text x="470" y="532" font-size="12.5" fill="#374151" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">응답 뒤 보율을 바꾼다 (UART)</text>
<text x="40" y="554" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">0x0021</text>
<text x="120" y="554" font-size="12.5" fill="#1e40af" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif">RESET</text>
<text x="230" y="554" font-size="12.5" fill="#374151" font-weight="400" font-family="ui-monospace,Menlo,monospace">—</text>
<text x="470" y="554" font-size="12.5" fill="#374151" font-weight="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Apple SD Gothic Neo',sans-serif"></text>
<text x="40" y="600" font-size="15" font-weight="700" fill="#1a1a2e">예시 (실제 바이트)</text>
<rect x="40" y="609" width="900" height="28" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
<text x="52" y="628" font-size="12.5" font-weight="600" fill="#1a1a2e">INFO 요청</text>
<text x="230" y="628" font-size="13" fill="#1e40af" font-family="ui-monospace,Menlo,monospace">02 FD 00 00 00 00 00 00 00 01</text>
<text x="928" y="628" font-size="11.5" fill="#6b7280" text-anchor="end">data 없음 · chk = ~(0x02+0xFD)+1 = 0x01</text>
<rect x="40" y="643" width="900" height="28" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
<text x="52" y="662" font-size="12.5" font-weight="600" fill="#1a1a2e">BAUD 4000000 요청</text>
<text x="230" y="662" font-size="13" fill="#1e40af" font-family="ui-monospace,Menlo,monospace">02 FD 00 20 00 00 00 04 00 00 09 3D 00 97</text>
<text x="928" y="662" font-size="11.5" fill="#6b7280" text-anchor="end">data = 4000000 (0x003D0900, LE)</text>
<rect x="40" y="677" width="900" height="28" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
<text x="52" y="696" font-size="12.5" font-weight="600" fill="#1a1a2e">BAUD 응답</text>
<text x="230" y="696" font-size="13" fill="#1e40af" font-family="ui-monospace,Menlo,monospace">02 FD 01 20 00 00 00 04 00 00 09 3D 00 96</text>
<text x="928" y="696" font-size="11.5" fill="#6b7280" text-anchor="end">type = RESP, err = 0</text>
<rect x="40" y="711" width="900" height="28" rx="5" fill="#ffffff" stroke="#e5e7eb"/>
<text x="52" y="730" font-size="12.5" font-weight="600" fill="#1a1a2e">FW_BEGIN boot 113920 B</text>
<text x="230" y="730" font-size="13" fill="#1e40af" font-family="ui-monospace,Menlo,monospace">02 FD 00 02 00 00 00 05 00 00 BD 01 00 01 3B</text>
<text x="928" y="730" font-size="11.5" fill="#6b7280" text-anchor="end">size = 0x0001BD00, target = 1</text>
<text x="952" y="786" font-size="11.5" fill="#9ca3af" text-anchor="end">UART 에서는 CLI 와 같은 포트 — 보드는 02 FD 로 시작하는 바이트를 헤더의 len 만큼 cmd 로 가져간다 · weact-h750 과 같은 형식</text>
</svg>